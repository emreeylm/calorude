name: Calorude
options:
  bundleIdPrefix: com.yemeboluum
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Calorude
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '6'
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: P6V2HMX86R
    SWIFT_EMIT_LOC_STRINGS: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Calorude:
    type: application
    platform: iOS
    sources: [Calorude]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yemeboluum.app
        TARGETED_DEVICE_FAMILY: '1'
  CalorudeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CalorudeTests]
    dependencies:
      - target: Calorude
  CalorudeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CalorudeUITests]
    dependencies:
      - target: Calorude
schemes:
  Calorude:
    build:
      targets:
        Calorude: all
    run:
      storeKitConfiguration: Calorude/Store/Development.storekit
    test:
      testPlans:
        - path: Screens.xctestplan
          defaultPlan: true
